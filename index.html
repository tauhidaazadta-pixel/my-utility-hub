<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ Utility Hub</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#f4f6f9;
    color:#1f2d3d;
    font-family:'Segoe UI','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---------- HEADER ---------- */
  .app-header{
    background:#007bff;
    color:#fff;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
  }
  .header-inner{
    max-width:600px;
    margin:0 auto;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{font-size:19px;font-weight:700;letter-spacing:.3px;}
  .badge{
    background:rgba(255,255,255,.2);
    color:#fff;
    border:none;
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }

  /* ---------- LAYOUT ---------- */
  .container{max-width:600px;margin:0 auto;padding:16px;flex:1;width:100%;}
  .view{display:none;}
  .view.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  /* ---------- COMMON UI ---------- */
  .back-btn{
    background:#6c757d;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    margin-bottom:16px;
  }
  .back-btn:hover{background:#5a6268;}

  .view-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 16px;
    color:#1a1a1a;
  }
  
  .panel{
    background:#fff;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
    border:1px solid #e0e0e0;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  
  .lbl{display:block;font-size:15px;font-weight:600;color:#333;margin:0 0 8px;}
  
  .input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    background:#f9f9f9;
    color:#1f2d3d;
    outline:none;
  }
  .input:focus{border-color:#007bff;background:#fff;}

  .input-group{margin-top:16px;}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  .primary-btn{
    width:100%;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    margin-top:18px;
    transition:background .2s;
  }
  .primary-btn:hover{background:#0069d9;}
  
  .err{color:#d9534f;font-size:15px;font-weight:700;text-align:center;}

  /* ---------- DASHBOARD GRID ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .card{
    aspect-ratio:1/1;
    background:#fff;
    border:1px solid #e4e9f0;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:8px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(16,42,74,.07);
  }
  .card:active{transform:scale(.95);}
  .card .emoji{font-size:32px;}
  .card .title{font-size:12px;font-weight:700;color:#243b53;text-align:center;line-height:1.3;}

  /* ---------- RESULT CARDS ---------- */
  .date-card{padding:14px;margin-bottom:12px;background:#fff;border-radius:12px;border:1px solid #e0e0e0;}
  .dc-head{font-size:13px;font-weight:800;color:#007bff;margin-bottom:12px;display:flex;justify-content:space-between;}
  .dc-sub{color:#888;font-size:11px;}
  .dc-body{display:flex;align-items:center;gap:14px;}
  .dc-num{
    font-size:36px;font-weight:800;color:#0b3d91;
    background:#eef4ff;border-radius:10px;padding:10px 14px;line-height:1;
  }
  .dc-info{flex:1;}
  .dc-day{font-size:18px;font-weight:800;color:#1f2d3d;margin-bottom:4px;}
  .dc-line{font-size:14px;color:#555;line-height:1.6;}
  .dc-line b{color:#1f2d3d;}

  .age-card{
    background:linear-gradient(135deg,#007bff,#00a2ff);
    color:#fff;border:none;padding:16px;border-radius:12px;margin-bottom:12px;
    box-shadow:0 4px 12px rgba(0,123,255,.3);
  }
  .age-title{font-size:14px;font-weight:600;margin-bottom:8px;}
  .age-big{font-size:20px;font-weight:700;}
  .age-big b{font-size:26px;}
  .age-sub{font-size:13px;margin-top:8px;opacity:.9;}

  /* ---------- FOOTER ---------- */
  .footer {
    text-align: center;
    color: #888;
    font-size: 14px;
    padding: 20px 0;
    margin-top: auto;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">🛠️ Utility Hub</div>
    <button class="badge" onclick="showView('dashboard')">Web Tools</button>
  </div>
</header>

<main class="container">
  <!-- ================= DASHBOARD ================= -->
  <section id="view-dashboard" class="view active">
    <div class="grid">
      <button class="card" onclick="showView('date')">
        <span class="emoji">📅</span><span class="title">आज की तारीख</span>
      </button>
      <button class="card" onclick="showView('age')">
        <span class="emoji">🎂</span><span class="title">एज एवं कैलेंडर कन्वर्टर</span>
      </button>
      <button class="card" onclick="showView('pass')">
        <span class="emoji">🔒</span><span class="title">पासवर्ड जनरेटर</span>
      </button>
      <button class="card" onclick="showView('calc')">
        <span class="emoji">🧮</span><span class="title">कैलकुलेटर</span>
      </button>
      <button class="card" onclick="showView('weight')">
        <span class="emoji">⚖️</span><span class="title">वजन कन्वर्टर</span>
      </button>
      <button class="card" onclick="showView('qr')">
        <span class="emoji">📱</span><span class="title">QR कोड जनरेटर</span>
      </button>
    </div>
  </section>

  <!-- ================= TOOL 1 : TODAY'S DATE ================= -->
  <section id="view-date" class="view">
    <button class="back-btn" onclick="showView('dashboard')">⬅ होम पर जाएं</button>
    <h2 class="view-title">📅 आज की तारीख</h2>
    <div id="todayContent"></div>
  </section>

  <!-- ================= TOOL 2 : AGE CONVERTER ================= -->
  <section id="view-age" class="view">
    <button class="back-btn" onclick="showView('dashboard')">⬅ होम पर जाएं</button>
    <h2 class="view-title">🎂 एज कैलकुलेटर एवं कन्वर्टर</h2>

    <div class="panel">
      <label class="lbl">कैलेंडर चुनें:</label>
      <select id="calType" class="input" onchange="toggleCalendarInputs()">
        <option value="AD">इंग्लिश / ईस्वी (AD)</option>
        <option value="BS">नेपाली (BS)</option>
        <option value="AH">उर्दू / हिजरी (AH)</option>
      </select>

      <div id="adInputs" class="input-group">
        <label class="lbl">जन्म तिथि (AD):</label>
        <input type="date" id="adDate" class="input">
      </div>

      <div id="bsInputs" class="input-group" style="display:none;">
        <div class="three">
          <div><label class="lbl">वर्ष (BS)</label><input type="number" id="bsYear" class="input" value="2081"></div>
          <div><label class="lbl">महीना</label><select id="bsMonth" class="input"></select></div>
          <div><label class="lbl">गते</label><input type="number" id="bsDay" class="input" value="1"></div>
        </div>
      </div>

      <div id="ahInputs" class="input-group" style="display:none;">
        <div class="three">
          <div><label class="lbl">वर्ष (AH)</label><input type="number" id="ahYear" class="input" value="1445"></div>
          <div><label class="lbl">महीना</label><select id="ahMonth" class="input"></select></div>
          <div><label class="lbl">दिन</label><input type="number" id="ahDay" class="input" value="1"></div>
        </div>
      </div>

      <button class="primary-btn" onclick="calculateAgeAndConvert()">उम्र और डिटेल देखें</button>
    </div>

    <!-- Result Output -->
    <div id="ageResult"></div>
  </section>

  <!-- ================= TOOL 3 : PASSWORD ================= -->
  <section id="view-pass" class="view">
    <button class="back-btn" onclick="showView('dashboard')">⬅ होम पर जाएं</button>
    <h2 class="view-title">🔒 पासवर्ड जनरेटर</h2>
    <div class="panel">
      <div id="passBox" style="background:#f1f5fb; border:1px dashed #b9cde6; border-radius:8px; padding:16px; font-family:monospace; font-size:20px; text-align:center; font-weight:bold; color:#0b3d91; word-break:break-all; margin-bottom:16px;">—</div>
      <button class="primary-btn" onclick="generatePassword()">नया पासवर्ड बनाएं</button>
      <button class="primary-btn" style="background:#6c757d; margin-top:8px;" onclick="copyPassword()">कॉपी करें</button>
    </div>
  </section>

  <!-- ================= TOOL 4 : CALCULATOR ================= -->
  <section id="view-calc" class="view">
    <button class="back-btn" onclick="showView('dashboard')">⬅ होम पर जाएं</button>
    <h2 class="view-title">🧮 कैलकुलेटर</h2>
    <div class="panel">
      <div id="calcDisplay" style="background:#0f172a; color:#fff; border-radius:8px; padding:16px; font-size:26px; text-align:right; margin-bottom:16px; overflow-x:auto; white-space:nowrap;">0</div>
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;" id="calcKeys">
        <button class="ck" onclick="calcPress('C')" style="background:#ffe9e6; color:#d9534f; font-weight:bold; padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer;">C</button>
        <button class="ck" onclick="calcPress('(')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">(</button>
        <button class="ck" onclick="calcPress(')')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">)</button>
        <button class="ck" onclick="calcPress('/')" style="background:#e3efff; color:#0069d9; font-weight:bold; padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer;">÷</button>
        
        <button class="ck" onclick="calcPress('7')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">7</button>
        <button class="ck" onclick="calcPress('8')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">8</button>
        <button class="ck" onclick="calcPress('9')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">9</button>
        <button class="ck" onclick="calcPress('*')" style="background:#e3efff; color:#0069d9; font-weight:bold; padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer;">×</button>
        
        <button class="ck" onclick="calcPress('4')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">4</button>
        <button class="ck" onclick="calcPress('5')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">5</button>
        <button class="ck" onclick="calcPress('6')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">6</button>
        <button class="ck" onclick="calcPress('-')" style="background:#e3efff; color:#0069d9; font-weight:bold; padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer;">−</button>
        
        <button class="ck" onclick="calcPress('1')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">1</button>
        <button class="ck" onclick="calcPress('2')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">2</button>
        <button class="ck" onclick="calcPress('3')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">3</button>
        <button class="ck" onclick="calcPress('+')" style="background:#e3efff; color:#0069d9; font-weight:bold; padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer;">+</button>
        
        <button class="ck" onclick="calcPress('0')" style="grid-column:span 2; padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">0</button>
        <button class="ck" onclick="calcPress('.')" style="padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer; background:#f1f5fb;">.</button>
        <button class="ck" onclick="calcPress('=')" style="background:#007bff; color:#fff; font-weight:bold; padding:15px; border:none; border-radius:8px; font-size:18px; cursor:pointer;">=</button>
      </div>
    </div>
  </section>

  <!-- ================= TOOL 5 : WEIGHT ================= -->
  <section id="view-weight" class="view">
    <button class="back-btn" onclick="showView('dashboard')">⬅ होम पर जाएं</button>
    <h2 class="view-title">⚖️ वजन कन्वर्टर</h2>
    <div class="panel">
      <label class="lbl">वजन (किलोग्राम - KG):</label>
      <input type="number" id="kgInput" class="input" placeholder="जैसे: 5" oninput="convertWeight()">
      <div style="background:#e9f7ef; color:#1b7a43; padding:16px; text-align:center; font-size:22px; font-weight:bold; margin-top:16px; border-radius:8px;">
        <span id="gramResult">0</span> ग्राम
      </div>
    </div>
  </section>

  <!-- ================= TOOL 6 : QR ================= -->
  <section id="view-qr" class="view">
    <button class="back-btn" onclick="showView('dashboard')">⬅ होम पर जाएं</button>
    <h2 class="view-title">📱 QR कोड जनरेटर</h2>
    <div class="panel">
      <label class="lbl">टेक्स्ट या URL डालें:</label>
      <input type="text" id="qrText" class="input" placeholder="https://example.com">
      <button class="primary-btn" onclick="makeQR()">QR कोड बनाएं</button>
      <div id="qrBox" style="margin-top:16px; text-align:center;"></div>
    </div>
  </section>
</main>

<footer class="footer">
  © Utility Hub • Web Tools Collection
</footer>

<!-- Nepali Date Converter Library -->
<script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@2.0.1/dist/nepali-date-converter.umd.min.js"></script>

<script>
  /* ==========================================
     CONSTANTS & HELPERS
     ========================================== */
  const EN_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const EN_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const NP_DAYS = ['आइतबार','सोमबार','मंगलबार','बुधबार','बिहीबार','शुक्रबार','शनिबार'];
  const NP_MONTHS = ['बैशाख','जेठ','असार','श्रावण','भाद्र','आश्विन','कार्तिक','मंसिर','पुष','माघ','फाल्गुन','चैत्र'];
  const UR_DAYS = ['अल-अहद','अल-इस्नैन','अल-सलासा',"अल-अरबा'",'अल-खमीस','अल-जुमा','अस-सब्त'];
  const UR_MONTHS = ['मुहर्रम','सफ़र','रबी उल अव्वल','रबी उस सानी','जुमादा अल-अव्वल','जुमादा अस-सानी','रजब','शाबान','रमज़ान','शव्वाल','ज़िलक़ाद','ज़िलहिज्जा'];

  const pad2 = n => (n < 10 ? '0' : '') + n;
  const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const noon = (y, m, d) => new Date(y, m, d, 12, 0, 0, 0);

  /* ==========================================
     HIJRI (ISLAMIC) CALENDAR logic
     ========================================== */
  let hijriFmt = null;
  try {
    hijriFmt = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' });
    hijriFmt.format(new Date());
  } catch (e) {
    try {
      hijriFmt = new Intl.DateTimeFormat('en-US-u-ca-islamic', { day: 'numeric', month: 'numeric', year: 'numeric' });
    } catch (e2) { hijriFmt = null; }
  }

  function hijriParts(date) {
    if (!hijriFmt) return null;
    try {
      const parts = hijriFmt.formatToParts(date);
      let y = 0, m = 0, d = 0;
      for (let p of parts) {
        let v = parseInt(p.value.replace(/[^0-9]/g, ''), 10);
        if (isNaN(v)) continue;
        if (p.type === 'year') y = v;
        else if (p.type === 'month') m = v;
        else if (p.type === 'day') d = v;
      }
      return (y && m && d) ? { year: y, month: m, day: d } : null;
    } catch (e) { return null; }
  }

  /* ==========================================
     BREAKDOWN BUILDERS
     ========================================== */
  function adBreakdown(date) {
    return {
      dayName: EN_DAYS[date.getDay()],
      date: date.getDate(),
      monthName: EN_MONTHS[date.getMonth()],
      monthNum: date.getMonth() + 1,
      year: date.getFullYear()
    };
  }

  function bsBreakdown(date) {
    const C = window.NepaliDateConverter || window.NepaliDate;
    if (!C) return null;
    try {
      const nd = new C(date);
      const mIdx = nd.getMonth();
      return {
        dayName: NP_DAYS[date.getDay()],
        date: nd.getDate(),
        monthName: NP_MONTHS[mIdx] || ('महीना ' + (mIdx + 1)),
        monthNum: mIdx + 1,
        year: nd.getYear()
      };
    } catch (e) { return null; }
  }

  function ahBreakdown(date) {
    const p = hijriParts(date);
    if (!p) return null;
    return {
      dayName: UR_DAYS[date.getDay()],
      date: p.day,
      monthName: UR_MONTHS[p.month - 1] || ('महीना ' + p.month),
      monthNum: p.month,
      year: p.year
    };
  }

  /* ==========================================
     UI RENDERERS
     ========================================== */
  function dateCardHTML(title, subtitle, b) {
    if (!b) return `<div class="date-card"><div class="dc-head">${title}</div><div class="err">यह कैलेंडर इस डिवाइस पर उपलब्ध नहीं है।</div></div>`;
    return `
      <div class="date-card">
        <div class="dc-head"><span>${title}</span><span class="dc-sub">${subtitle}</span></div>
        <div class="dc-body">
          <div class="dc-num">${b.date}</div>
          <div class="dc-info">
            <div class="dc-day">${b.dayName}</div>
            <div class="dc-line">महीना: <b>${b.monthName}</b> (${pad2(b.monthNum)})</div>
            <div class="dc-line">वर्ष: <b>${b.year}</b></div>
          </div>
        </div>
      </div>`;
  }

  function renderToday() {
    const box = document.getElementById('todayContent');
    if (!box) return;
    const now = new Date();
    box.innerHTML = 
      dateCardHTML('अंग्रेज़ी (AD)', 'ENGLISH', adBreakdown(now)) +
      dateCardHTML('नेपाली (BS)', 'NEPALI', bsBreakdown(now)) +
      dateCardHTML('उर्दू / हिजरी (AH)', 'HIJRI', ahBreakdown(now));
  }

  /* ==========================================
     NAVIGATION
     ========================================== */
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const target = document.getElementById('view-' + id);
    if (target) target.classList.add('active');
    
    if (id === 'date') renderToday();
    if (id === 'pass') generatePassword();
    if (id === 'age') initAgeDefaults();
  }

  /* ==========================================
     TOOL 2: AGE CALCULATOR LOGIC
     ========================================== */
  function initAgeDefaults() {
    const now = new Date();
    const adInput = document.getElementById('adDate');
    if (adInput && !adInput.value) adInput.value = isoOf(now);

    // Populate Dropdowns
    const bsSel = document.getElementById('bsMonth');
    const ahSel = document.getElementById('ahMonth');
    if (bsSel && bsSel.options.length === 0) {
      NP_MONTHS.forEach((m, i) => bsSel.add(new Option(`${i+1} - ${m}`, i+1)));
      UR_MONTHS.forEach((m, i) => ahSel.add(new Option(`${i+1} - ${m}`, i+1)));
    }
  }

  function toggleCalendarInputs() {
    const type = document.getElementById('calType').value;
    document.getElementById('adInputs').style.display = type === 'AD' ? 'block' : 'none';
    document.getElementById('bsInputs').style.display = type === 'BS' ? 'block' : 'none';
    document.getElementById('ahInputs').style.display = type === 'AH' ? 'block' : 'none';
  }

  function calcAge(from, to) {
    let y = to.getFullYear() - from.getFullYear();
    let m = to.getMonth() - from.getMonth();
    let d = to.getDate() - from.getDate();
    if (d < 0) {
      m--;
      d += new Date(to.getFullYear(), to.getMonth(), 0).getDate();
    }
    if (m < 0) {
      y--;
      m += 12;
    }
    return { y, m, d };
  }

  function calculateAgeAndConvert() {
    const out = document.getElementById('ageResult');
    if (!out) return;
    
    const type = document.getElementById('calType').value;
    let date = null;

    try {
      if (type === 'AD') {
        const v = document.getElementById('adDate').value;
        if (!v) throw new Error('कृपया जन्म तिथि चुनें।');
        const p = v.split('-');
        date = noon(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
      } 
      else if (type === 'BS') {
        const y = parseInt(document.getElementById('bsYear').value, 10);
        const m = parseInt(document.getElementById('bsMonth').value, 10);
        const d = parseInt(document.getElementById('bsDay').value, 10);
        if (!y || !m || !d) throw new Error('कृपया नेपाली तिथि भरें।');
        const C = window.NepaliDateConverter || window.NepaliDate;
        if (!C) throw new Error('नेपाली कैलेंडर लाइब्रेरी लोड नहीं हुई।');
        const nd = new C(y, m - 1, d);
        const js = nd.toJsDate();
        date = noon(js.getFullYear(), js.getMonth(), js.getDate());
      } 
      else {
        // (AH Fallback to AD search)
        const y = parseInt(document.getElementById('ahYear').value, 10);
        const m = parseInt(document.getElementById('ahMonth').value, 10);
        const d = parseInt(document.getElementById('ahDay').value, 10);
        if (!y || !m || !d) throw new Error('कृपया हिजरी तिथि भरें।');
        // Simple approx search for Hijri
        const estDays = (y - 1) * 354.367 + (m - 1) * 29.53 + (d - 1);
        let base = new Date(Date.UTC(622, 6, 19) + estDays * 86400000);
        let found = null;
        for (let i = -15; i <= 15; i++) {
          let cand = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i, 12, 0, 0);
          let p = hijriParts(cand);
          if (p && p.year === y && p.month === m && p.day === d) { found = cand; break; }
        }
        date = found || base;
      }

      if (!date || isNaN(date.getTime())) throw new Error('अमान्य तिथि!');

    } catch (err) {
      out.innerHTML = `<div class="panel"><div class="err">त्रुटि: ${err.message}</div></div>`;
      return;
    }

    // Calculate Age
    const today = new Date();
    const todayNoon = noon(today.getFullYear(), today.getMonth(), today.getDate());
    
    let ageHTML = '';
    if (date.getTime() > todayNoon.getTime()) {
      ageHTML = `<div class="age-card"><div class="age-title">🎂 उम्र</div><div class="age-big">चुनी गई तारीख भविष्य की है</div></div>`;
    } else {
      const a = calcAge(date, todayNoon);
      const totalDays = Math.round((todayNoon - date) / 86400000);
      ageHTML = `
        <div class="age-card">
          <div class="age-title">🎂 आपकी उम्र</div>
          <div class="age-big"><b>${a.y}</b> वर्ष <b>${a.m}</b> महीने <b>${a.d}</b> दिन</div>
          <div class="age-sub">कुल दिन: ${totalDays.toLocaleString('en-IN')}</div>
        </div>`;
    }

    // Render Output
    out.innerHTML = ageHTML + 
                    dateCardHTML('अंग्रेज़ी (AD)', 'ENGLISH', adBreakdown(date)) +
                    dateCardHTML('नेपाली (BS)', 'NEPALI', bsBreakdown(date)) +
                    dateCardHTML('उर्दू / हिजरी (AH)', 'HIJRI', ahBreakdown(date));
  }

  /* ==========================================
     TOOL 3: PASSWORD GENERATOR
     ========================================== */
  function generatePassword() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*";
    let pass = "";
    // Guarantee at least 1 uppercase, 1 lowercase, 1 number, 1 special
    pass += "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)];
    pass += "abcdefghijkmnopqrstuvwxyz"[Math.floor(Math.random() * 24)];
    pass += "23456789"[Math.floor(Math.random() * 8)];
    pass += "!@#$%^&*"[Math.floor(Math.random() * 8)];
    
    for (let i = 4; i < 10; i++) {
      pass += chars[Math.floor(Math.random() * chars.length)];
    }
    // Shuffle
    pass = pass.split('').sort(() => 0.5 - Math.random()).join('');
    
    document.getElementById('passBox').textContent = pass;
  }

  function copyPassword() {
    const text = document.getElementById('passBox').textContent;
    if (!text || text === '—') return;
    navigator.clipboard.writeText(text).then(() => {
      alert("पासवर्ड कॉपी हो गया!");
    }).catch(() => {
      alert("कॉपी करने में असमर्थ, कृपया मैन्युअली कॉपी करें।");
    });
  }

  /* ==========================================
     TOOL 4: CALCULATOR
     ========================================== */
  let calcExpr = '';
  let calcDone = false;

  function calcPress(k) {
    const display = document.getElementById('calcDisplay');
    
    if (k === 'C') {
      calcExpr = '';
      calcDone = false;
      display.textContent = '0';
      return;
    }
    
    if (k === '=') {
      if (!calcExpr) return;
      try {
        // Safe evaluation
        const res = Function('"use strict"; return (' + calcExpr + ')')();
        if (!isFinite(res)) throw new Error('Math Error');
        calcExpr = String(Math.round(res * 1e10) / 1e10);
        display.textContent = calcExpr;
        calcDone = true;
      } catch (e) {
        display.textContent = 'Error';
        calcExpr = '';
        calcDone = true;
      }
      return;
    }

    if (calcDone) {
      if (/[0-9.]/.test(k)) calcExpr = '';
      calcDone = false;
    }

    if (/[+\-*/]/.test(k) && /[+\-*/]$/.test(calcExpr)) {
      calcExpr = calcExpr.slice(0, -1);
    }

    calcExpr += k;
    display.textContent = calcExpr.replace(/\*/g, '×').replace(/\//g, '÷');
  }

  /* ==========================================
     TOOL 5: WEIGHT CONVERTER
     ========================================== */
  function convertWeight() {
    const kg = parseFloat(document.getElementById('kgInput').value);
    const out = document.getElementById('gramResult');
    if (isNaN(kg)) {
      out.textContent = '0';
      return;
    }
    out.textContent = (kg * 1000).toLocaleString('en-IN');
  }

  /* ==========================================
     TOOL 6: QR CODE GENERATOR
     ========================================== */
  function makeQR() {
    const text = document.getElementById('qrText').value.trim();
    const box = document.getElementById('qrBox');
    if (!text) {
      box.innerHTML = '<span class="err">कृपया कुछ टेक्स्ट डालें</span>';
      return;
    }
    const url = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`;
    box.innerHTML = `<img src="${url}" alt="QR Code" style="width:200px; height:200px; border-radius:8px; border:1px solid #ccc; padding:5px; background:#fff;">`;
  }

  /* ==========================================
     INITIALIZATION
     ========================================== */
  document.addEventListener('DOMContentLoaded', () => {
    initAgeDefaults();
  });

</script>
