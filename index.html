<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Hub - Multi Calendar Converter</title>
    <!-- Nepali Calendar JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@2.0.1/dist/nepali-date-converter.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .today-banner {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .today-banner h3 {
            margin: 0 0 8px 0;
            color: #0d47a1;
            font-size: 1rem;
        }
        .today-date-text {
            font-weight: bold;
            color: #1565c0;
            font-size: 0.95rem;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            color: #333;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .action-btn {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .action-btn:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 18px;
            padding: 12px;
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            border-radius: 4px;
        }
        .result-item {
            margin: 8px 0;
            font-size: 0.95rem;
            color: #212529;
        }
    </style>
</head>
<body>

    <header>🛠️ Utility Hub - मल्टी कैलेंडर कन्वर्टर</header>

    <div class="container">
        
        <!-- आज की तारीख (Today's Date Banner) -->
        <div class="today-banner">
            <h3>📅 आज की तारीख (Today's Date)</h3>
            <div class="today-date-text" id="todayEnglish">English (AD): लोड हो रहा है...</div>
            <div class="today-date-text" id="todayNepali">नेपाली (BS): लोड हो रहा है...</div>
        </div>

        <!-- डेट एंड एज कन्वर्टर कार्ड -->
        <div class="card">
            <h2>🎂 मल्टी-डेट कन्वर्टर एवं एज कैलकुलेटर</h2>
            
            <label for="calendarType">आप किस कैलेंडर में तारीख दर्ज कर रहे हैं?</label>
            <select id="calendarType" onchange="toggleInputs()">
                <option value="AD">इंग्लिश / हिंदी (AD - ईस्वी)</option>
                <option value="BS">नेपाली (BS - विक्रम संवत)</option>
                <option value="AH">उर्दू / इस्लामिक (AH - हिजरी)</option>
            </select>

            <!-- 1. इंग्लिश इनपुट -->
            <div id="input-AD">
                <label for="adDate">तारीख चुनें (AD):</label>
                <input type="date" id="adDate">
            </div>

            <!-- 2. नेपाली इनपुट -->
            <div id="input-BS" style="display: none;">
                <label>नेपाली तारीख दर्ज करें (साल / महीना / दिन):</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="bsYear" placeholder="2081" min="2000" max="2090">
                    <input type="number" id="bsMonth" placeholder="महीना (1-12)" min="1" max="12">
                    <input type="number" id="bsDay" placeholder="दिन (1-32)" min="1" max="32">
                </div>
            </div>

            <!-- 3. उर्दू इनपुट -->
            <div id="input-AH" style="display: none;">
                <label>उर्दू/हिजरी तारीख दर्ज करें (साल / महीना / दिन):</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="ahYear" placeholder="1446" min="1300" max="1500">
                    <input type="number" id="ahMonth" placeholder="महीना (1-12)" min="1" max="12">
                    <input type="number" id="ahDay" placeholder="दिन (1-30)" min="1" max="30">
                </div>
            </div>

            <button class="action-btn" onclick="processConversion()">कन्वर्ट करें और उम्र पता करें</button>

            <!-- रिजल्ट सेक्शन -->
            <div class="result-box" id="resultContainer" style="display: none;">
                <div class="result-item" id="ageResult"></div>
                <hr>
                <div class="result-item" id="convResult1"></div>
                <div class="result-item" id="convResult2"></div>
            </div>
        </div>

    </div>

    <script>
        // पेज लोड होने पर आज की तारीख सेट करना
        window.onload = function() {
            setTodayDates();
        };

        function setTodayDates() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');

            // आज की इंग्लिश तारीख
            document.getElementById('todayEnglish').innerText = `English (AD): ${year}-${month}-${day}`;
            document.getElementById('adDate').value = `${year}-${month}-${day}`;

            // आज की नेपाली तारीख
            try {
                const nepDate = new NepaliDate(today);
                const nepMonthsHindi = ["बैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कार्तिक", "मंसिर", "पुस", "माघ", "फागुन", "चैत"];
                document.getElementById('todayNepali').innerText = `नेपाली (BS): ${nepDate.getYear()} ${nepMonthsHindi[nepDate.getMonth()]} ${nepDate.getDate()} गते`;
            } catch(e) {
                document.getElementById('todayNepali').innerText = `नेपाली (BS): ऑटो-कैलकुलेशन अनुपलब्ध`;
            }
        }

        function toggleInputs() {
            const type = document.getElementById('calendarType').value;
            document.getElementById('input-AD').style.display = (type === 'AD') ? 'block' : 'none';
            document.getElementById('input-BS').style.display = (type === 'BS') ? 'block' : 'none';
            document.getElementById('input-AH').style.display = (type === 'AH') ? 'block' : 'none';
            document.getElementById('resultContainer').style.display = 'none';
        }

        // हिजरी (उर्दू) से AD का अनुमानित कैलकुलेटर
        function hijriToGregorian(hYear, hMonth, hDay) {
            const jd = Math.floor((11 * hYear + 3) / 30) + 354 * hYear + 30 * hMonth - Math.floor((hMonth - 1) / 2) + hDay + 1948440 - 385;
            let l = jd + 68569;
            let n = Math.floor((4 * l) / 146097);
            l = l - Math.floor((146097 * n + 3) / 4);
            let i = Math.floor((4000 * (l + 1)) / 1461001);
            l = l - Math.floor((1461 * i) / 4) + 31;
            let j = Math.floor((80 * l) / 2447);
            let day = l - Math.floor((2447 * j) / 80);
            l = Math.floor(j / 11);
            let month = j + 2 - 12 * l;
            let year = 100 * (n - 49) + i + l;
            return new Date(year, month - 1, day);
        }

        // AD से हिजरी (उर्दू) का अनुमानित कैलकुलेटर
        function gregorianToHijri(gDate) {
            const day = gDate.getDate();
            const month = gDate.getMonth() + 1;
            const year = gDate.getFullYear();
            
            let m = month;
            let y = year;
            if (m < 3) {
                y -= 1;
                m += 12;
            }

            let a = Math.floor(y / 100);
            let b = 2 - a + Math.floor(a / 4);
            let jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + b - 1524.5;

            let z = jd - 1948440 + 10632;
            let n = Math.floor((z - 1) / 10631);
            z = z - 10631 * n + 354;
            let j = Math.floor((10985 - z) / 5316) * Math.floor((50 * z) / 17719) + Math.floor(z / 5670) * Math.floor((43 * z) / 15238);
            z = z - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
            
            let hMonth = Math.floor((24 * z) / 709);
            let hDay = z - Math.floor((709 * hMonth) / 24);
            let hYear = 30 * n + j - 30;

            const urduMonths = ["मुहर्रम", "सफ़र", "रबी उल-अव्वल", "रबी अल-थानी", "जुमादा अल-अव्वल", "जुमादा अल-थानी", "रजब", "शबान", "रमजान", "शव्वाल", "जुल क़ादा", "जुल हिज्जा"];
            return `${hDay} ${urduMonths[hMonth - 1]} ${hYear} (AH)`;
        }

        function processConversion() {
            const calendarType = document.getElementById('calendarType').value;
            let adDateObj = null;

            if (calendarType === 'AD') {
                const val = document.getElementById('adDate').value;
                if (!val) { alert("कृपया तारीख चुनें!"); return; }
                adDateObj = new Date(val);
            } else if (calendarType === 'BS') {
                const y = parseInt(document.getElementById('bsYear').value);
                const m = parseInt(document.getElementById('bsMonth').value) - 1;
                const d = parseInt(document.getElementById('bsDay').value);
                if (!y || isNaN(m) || !d) { alert("कृपया नेपाली तारीख पूरी भरें!"); return; }
                try {
                    const nep = new NepaliDate(y, m, d);
                    adDateObj = nep.toJsDate();
                } catch(e) {
                    alert("अमान्य नेपाली तारीख!"); return;
                }
            } else if (calendarType === 'AH') {
                const y = parseInt(document.getElementById('ahYear').value);
                const m = parseInt(document.getElementById('ahMonth').value);
                const d = parseInt(document.getElementById('ahDay').value);
                if (!y || !m || !d) { alert("कृपया उर्दू तारीख पूरी भरें!"); return; }
                adDateObj = hijriToGregorian(y, m, d);
            }

            // उम्र कैलकुलेशन
            const today = new Date();
            let age = today.getFullYear() - adDateObj.getFullYear();
            const mDiff = today.getMonth() - adDateObj.getMonth();
            if (mDiff < 0 || (mDiff === 0 && today.getDate() < adDateObj.getDate())) {
                age--;
            }

            // आउटपुट तैयार करना
            const nepMonthsHindi = ["बैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कार्तिक", "मंसिर", "पुस", "माघ", "फागुन", "चैत"];
            const nepDateObj = new NepaliDate(adDateObj);
            const nepStr = `${nepDateObj.getYear()} ${nepMonthsHindi[nepDateObj.getMonth()]} ${nepDateObj.getDate()} गते (BS)`;
            const hijriStr = gregorianToHijri(adDateObj);
            const adStr = `${adDateObj.getFullYear()}-${String(adDateObj.getMonth()+1).padStart(2,'0')}-${String(adDateObj.getDate()).padStart(2,'0')} (AD/ईस्वी)`;

            document.getElementById('ageResult').innerHTML = `<b>कुल उम्र:</b> ${age} वर्ष`;

            if (calendarType === 'AD') {
                document.getElementById('convResult1').innerHTML = `<b>नेपाली (BS):</b> ${nepStr}`;
                document.getElementById('convResult2').innerHTML = `<b>उर्दू (AH):</b> ${hijriStr}`;
            } else if (calendarType === 'BS') {
                document.getElementById('convResult1').innerHTML = `<b>इंग्लिश/हिंदी (AD):</b> ${adStr}`;
                document.getElementById('convResult2').innerHTML = `<b>उर्दू (AH):</b> ${hijriStr}`;
            } else if (calendarType === 'AH') {
                document.getElementById('convResult1').innerHTML = `<b>इंग्लिश/हिंदी (AD):</b> ${adStr}`;
                document.getElementById('convResult2').innerHTML = `<b>नेपाली (BS):</b> ${nepStr}`;
            }

            document.getElementById('resultContainer').style.display = 'block';
        }
    </script>
</body>
</html>
